name: Build

on:
  push:
    branches: [master, pre-synth-v1]
    paths-ignore:            # 纯文档不可能弄坏构建，别为它跑三平台
      - '**.md'
      - 'docs/**'
      - 'TODO.md'
  pull_request:
    branches: [master]
  workflow_dispatch:

# 同一分支连续推送时，旧的 run 已经没人看了 —— 直接取消
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # 只留一份：zoom 只是编译期的 ADOCAO_MIN_ZOOM 常量，与平台无关，
    # 那个矩阵放到便宜的 linux 上跑（见下）
    name: windows-portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            git

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DADOCAO_PORTABLE=ON

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: build/ADOCAO.exe

  linux:
    strategy:
      matrix:
        zoom: [Ultra, Unimaginable]   # 默认 + 极端值（便宜的平台上多验一个编译常量）
    name: linux-${{ matrix.zoom }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libwayland-dev libxkbcommon-dev libgl-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Check core purity
        run: scripts/check-core-purity.sh

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DADOCAO_ZOOM_LEVEL=${{ matrix.zoom }}

      - name: Build
        run: cmake --build build --parallel

      - name: Tests (parser parity + tile geometry)
        run: ctest --test-dir build --output-on-failure

      - name: Guards (core purity + CLI help + shader fallbacks)
        run: |
          bash scripts/check-core-purity.sh
          bash scripts/check-cli-help.sh
          bash scripts/check-shader-fallback.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.zoom }}
          path: build/ADOCAO

  macOS:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package .app bundle (binary + assets, ad-hoc signed)
        run: scripts/make-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/ADOCAO.app
