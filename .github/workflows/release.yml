name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-release-${{ hashFiles('CMakeLists.txt') }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            git

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DADOCAO_PORTABLE=ON \
            -DADOCAO_ZOOM_LEVEL=Hyper

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Package (historical release name)
        shell: msys2 {0}
        run: cp build/ADOCAO.exe ADOCAO-Windows.exe

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          files: |
            ADOCAO-Windows.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-release-${{ hashFiles('CMakeLists.txt') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libwayland-dev libxkbcommon-dev libgl-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DADOCAO_ZOOM_LEVEL=Hyper

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Package data
        run: |
          cd build && zip -r ADOCAO-data.zip ../assets

      - name: Package (historical release name)
        run: cp build/ADOCAO ADOCAO-Linux

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ADOCAO-Linux
            build/ADOCAO-data.zip

  macOS:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-release-${{ hashFiles('CMakeLists.txt') }}

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DADOCAO_ZOOM_LEVEL=Hyper

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)

      - name: Package .app bundle (binary + assets, ad-hoc signed)
        run: scripts/make-app.sh

      - name: Zip .app bundle (gh-release cannot upload a directory)
        run: ditto -c -k --sequesterRsrc --keepParent build/ADOCAO.app ADOCAO-macOS.zip

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ADOCAO-macOS.zip
