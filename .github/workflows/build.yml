name: Build

on:
  push:
    branches: [master, pre-synth-v1]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  windows:
    strategy:
      matrix:
        portable: [true]  # portable (static) only
        zoom: [Ultra, Unimaginable]  # test default + extreme
    name: windows-${{ matrix.zoom }}-portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            git

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DADOCAO_PORTABLE=${{ matrix.portable == true && 'ON' || 'OFF' }} \
            -DADOCAO_ZOOM_LEVEL=${{ matrix.zoom }}

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.zoom }}${{ matrix.portable && '-portable' || '' }}
          path: build/ADOCAO.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libwayland-dev libxkbcommon-dev libgl-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Check core purity
        run: scripts/check-core-purity.sh

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/ADOCAO

  macOS:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package .app bundle (binary + assets, ad-hoc signed)
        run: scripts/make-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/ADOCAO.app
