name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            git

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DADOCAO_PORTABLE=ON \
            -DADOCAO_ZOOM_LEVEL=Hyper

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          files: |
            build/ADOCAO.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make pkg-config \
            libwayland-dev libxkbcommon-dev libgl-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DADOCAO_ZOOM_LEVEL=Hyper

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Package data
        run: |
          cd build && zip -r ADOCAO-data.zip ../assets

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ADOCAO
            build/ADOCAO-data.zip

  macOS:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install dependencies
        run: |
          brew install cmake

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DADOCAO_ZOOM_LEVEL=Hyper

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)

      - name: Package thin .app
        run: |
          mkdir -p build/ADOCAO.app/Contents/MacOS
          cp build/ADOCAO build/ADOCAO.app/Contents/MacOS/ADOCAO
          chmod +x build/ADOCAO.app/Contents/MacOS/ADOCAO
          cat > build/ADOCAO.app/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>ADOCAO</string>
              <key>CFBundleIdentifier</key>
              <string>com.adocao.ADOCAO</string>
              <key>CFBundleName</key>
              <string>ADOCAO</string>
              <key>CFBundleDisplayName</key>
              <string>ADOCAO</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>6.0.0</string>
              <key>CFBundleVersion</key>
              <string>6.0.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>12.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ADOCAO.app
