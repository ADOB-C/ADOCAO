name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-release-${{ hashFiles('CMakeLists.txt') }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            git

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DADOCAO_PORTABLE=ON \
            -DADOCAO_BUILD_TESTS=OFF \
            -DADOCAO_ZOOM_LEVEL=Hyper

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --target adocao --parallel

      - name: Package (historical release name)
        shell: msys2 {0}
        run: cp build/ADOCAO.exe ADOCAO-Windows.exe

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          files: |
            ADOCAO-Windows.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-release-${{ hashFiles('CMakeLists.txt') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libwayland-dev libxkbcommon-dev libgl-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DADOCAO_BUILD_TESTS=OFF \
            -DADOCAO_ZOOM_LEVEL=Hyper

      - name: Build
        run: cmake --build build --target adocao --parallel $(nproc)

      - name: Package data (tar.xz)
        run: |
          cd build && tar -cJf ADOCAO-data.tar.xz -C .. assets

      - name: Package (historical release name)
        run: cp build/ADOCAO ADOCAO-Linux

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ADOCAO-Linux
            build/ADOCAO-data.tar.xz

  macOS:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-release-${{ hashFiles('CMakeLists.txt') }}

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Configure
        run: |
          # `CMAKE_OSX_DEPLOYMENT_TARGET` 必须钉住：不钉的话产物的 minos 会跟着 runner 的
          # macOS 版本跑（macos-15 → 用户得装 15），而 Info.plist 里写的是 12.0。
          # 12.0 也是**代码的下限**：曾经用过的 `std::to_chars`(double) 要 13.3，已换掉。
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DADOCAO_BUILD_TESTS=OFF \
            -DADOCAO_ZOOM_LEVEL=Hyper

      - name: Build
        run: cmake --build build --target adocao --parallel $(sysctl -n hw.ncpu)

      - name: Package .app bundle (binary + assets, ad-hoc signed)
        run: scripts/make-app.sh

      - name: Zip .app bundle (gh-release cannot upload a directory)
        run: ditto -c -k --sequesterRsrc --keepParent build/ADOCAO.app ADOCAO-macOS.zip

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ADOCAO-macOS.zip
